name: 夸克网盘每日领空间

on:
  schedule:
    - cron: '30 23 * * *'   # 北京时间 07:30 (UTC 23:30)
    - cron: '31 12 * * *'   # 北京时间 20:31 (UTC 12:31)
  workflow_dispatch:        # 允许手动触发

concurrency:
  group: quark-signin
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取 UTC+8 当前时间
        id: get-date
        run: echo "today=$(TZ='Asia/Taipei' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 匹配今日签到缓存
        id: cache-check
        uses: actions/cache@v4
        with:
          path: .signed_flag
          key: quark-signed-${{ steps.get-date.outputs.today }}

      - name: 已签到则跳过后续步骤
        if: steps.cache-check.outputs.cache-hit == 'true'
        run: echo "今日（${{ steps.get-date.outputs.today }}）已完成签到，跳过本次执行。"

      - name: 随机延迟（防风控）
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "31 12 * * *" ]; then
            delay=$((RANDOM % 30 + 1))
          else
            delay=$((RANDOM % 60 + 1))
          fi
          echo "随机延迟 $delay 秒后开始执行..."
          sleep $delay

      - name: 设置 Python 环境
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: pip install --no-cache-dir requests

      - name: 执行签到脚本
        if: steps.cache-check.outputs.cache-hit != 'true'
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
        run: python checkIn_Quark.py

      - name: 生成签到标记
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: date > .signed_flag

      - name: 清理旧的工作流记录
        uses: Mattraks/delete-workflow-runs@main
        if: always()
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 60
